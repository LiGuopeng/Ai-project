<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>SSE 前端解析演示</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 20px auto; padding: 0 16px; }
    section { border: 1px solid #ddd; border-radius: 8px; padding: 12px 16px; margin-bottom: 20px; }
    h2 { font-size: 16px; }
    ul { list-style: none; padding: 0; max-height: 260px; overflow-y: auto; }
    li { padding: 4px 8px; border-bottom: 1px dashed #eee; color: #333; }
    li span.id { color: #999; margin-right: 8px; font-size: 12px; }
  </style>
</head>
<body>
  <h1>SSE 前端解析演示（服务端 http://localhost:3000/sse）</h1>

  <section>
    <h2>方式一：EventSource —— 浏览器内置解析，最常用</h2>
    <ul id="es-list"></ul>
  </section>

  <section>
    <h2>方式二：fetch 手动解析 —— 理解 SSE 协议本质</h2>
    <ul id="manual-list"></ul>
  </section>

  <script>
    const esList = document.getElementById('es-list');
    const manualList = document.getElementById('manual-list');

    function add(list, data, id) {
      const li = document.createElement('li');
      const idSpan = id ? `<span class="id">#${id}</span>` : '';
      li.innerHTML = `${idSpan}${data}`;
      list.appendChild(li);
      list.scrollTop = list.scrollHeight;
    }

    // ============ 方式一：EventSource（浏览器自动完成 SSE 协议解析） ============
    const es = new EventSource('/sse');

    // 连接建立时触发（服务端重连也走这里）
    es.onopen = () => add(esList, '[open] 连接已建立');

    // 每收到一条消息触发：浏览器已经解析好 data:/id: 字段
    // e.data = data: 后的内容，e.lastEventId = id: 后的内容
    es.onmessage = (e) => add(esList, e.data, e.lastEventId);

    // 连接出错时触发；浏览器会自动重连（重新带上 Last-Event-ID 请求头）
    es.onerror = () => add(esList, '[error] 连接断开，浏览器自动重连中...');

    // ============ 方式二：fetch + ReadableStream 手动解析 ============
    // SSE 消息格式本质是一段文本协议：
    //   - 每条消息由若干行 field: value 组成（data: / id: / event: / retry:）
    //   - 空行（\n\n）表示一条消息结束
    async function readSSE() {
      const res = await fetch('/sse');
      const reader = res.body.getReader();        // 原始字节流，需要自己解析
      const decoder = new TextDecoder('utf-8');   // 字节 → 字符串
      let buffer = '';                            // 缓冲区：网络分片不保证刚好是一条完整消息

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;

        buffer += decoder.decode(value, { stream: true }); // stream:true 处理跨分片的多字节中文

        // 以空行 \n\n 切分出完整消息，最后一段可能不完整，留在缓冲区等下一个分片
        const parts = buffer.split('\n\n');
        buffer = parts.pop() ?? '';

        for (const part of parts) {
          if (!part.trim()) continue;
          let data = '', id = '';
          for (const line of part.split('\n')) {
            if (line.startsWith('data:')) data += line.slice(5).replace(/^ /, '');
            if (line.startsWith('id:')) id = line.slice(3).trim();
          }
          if (data) add(manualList, data, id);
        }
      }
    }
    readSSE();
  </script>
</body>
</html>
