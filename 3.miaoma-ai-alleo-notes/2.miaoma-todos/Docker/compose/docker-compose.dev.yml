services:
  postgres:
    image: postgres:latest
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-miaoma}
      POSTGRES_USER: ${POSTGRES_USER:-miaoma}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:latest
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-change-me}"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-change-me}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api-nest:
    build:
      context: ../..
      dockerfile: services/api-nest/Dockerfile
    environment:
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-miaoma}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-miaoma}
      REDIS_URL: redis://:${REDIS_PASSWORD:-change-me}@redis:6379/0
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  billing-spring:
    build:
      context: ../..
      dockerfile: services/billing-spring/Dockerfile
    environment:
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

  intelligence-fastapi:
    build:
      context: ../..
      dockerfile: services/intelligence-fastapi/Dockerfile
    ports:
      - "8000:8000"

volumes:
  postgres-data:
  redis-data:
