services:
  web:
    image: ${DOCKERHUB_NAMESPACE:-your-namespace}/miaoma-todo-web:${RELEASE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      api-nest:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - redis-data:/data

  api-nest:
    image: ${DOCKERHUB_NAMESPACE:-your-namespace}/miaoma-todo-api-nest:${RELEASE_TAG:-latest}
    restart: unless-stopped
    environment:
      API_PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_SECRET: ${JWT_SECRET}
    expose:
      - "3000"
    depends_on:
      postgres:
        condition: service_started
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/v1/health"]
      interval: 10s
      timeout: 3s
      retries: 10

  billing-spring:
    image: ${DOCKERHUB_NAMESPACE:-your-namespace}/miaoma-todo-billing-spring:${RELEASE_TAG:-latest}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
    expose:
      - "8080"

  intelligence-fastapi:
    image: ${DOCKERHUB_NAMESPACE:-your-namespace}/miaoma-todo-intelligence-fastapi:${RELEASE_TAG:-latest}
    restart: unless-stopped
    expose:
      - "8000"

volumes:
  postgres-data:
  redis-data:
