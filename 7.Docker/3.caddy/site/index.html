<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Caddy Static Site</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #101827;
      color: #f8fafc;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at top right, #234e70, transparent 45%), #101827;
    }

    main {
      width: min(680px, calc(100% - 40px));
      padding: 56px 48px;
      border: 1px solid rgba(148, 163, 184, .25);
      border-radius: 24px;
      background: rgba(15, 23, 42, .8);
      box-shadow: 0 24px 80px rgba(0, 0, 0, .35);
    }

    .tag {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      color: #bae6fd;
      background: rgba(14, 165, 233, .15);
      font-size: 13px;
      letter-spacing: .08em;
    }

    h1 { margin: 22px 0 12px; font-size: clamp(36px, 8vw, 64px); line-height: 1; }
    p { color: #cbd5e1; font-size: 18px; line-height: 1.7; }
    code { color: #7dd3fc; }

    @media (max-width: 520px) {
      main { padding: 36px 28px; }
    }
  </style>
</head>
<body>
  <main>
    <span class="tag">CADDY + DOCKER</span>
    <h1>Hello, Caddy!</h1>
    <p>
      这是通过本地 <code>site/</code> 目录映射进 Docker 容器的静态首页。
      你可以直接替换这个文件，保存后刷新浏览器即可看到更新。
    </p>
  </main>
</body>
</html>
