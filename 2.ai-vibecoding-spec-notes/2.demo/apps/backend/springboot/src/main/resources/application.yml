server:
  address: ${APP_HOST:0.0.0.0}
  port: ${APP_PORT:8082}
  error:
    include-message: always

spring:
  application:
    name: todo-list-springboot
  datasource:
    url: jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5433}/${DB_NAME:todo_list}?sslmode=disable
    username: ${DB_USER:todo_list}
    password: ${DB_PASSWORD:todo_list_dev}
    hikari:
      maximum-pool-size: 10
  sql:
    init:
      mode: always
