version: '3'
services:
  miaoma-lgp-services:
    image: postgres:18-alpine
    container_name: miaoma-lgp-services
    ports:
      - 5432:5432
    environment:
      POSTGRES_USER: lgp
      POSTGRES_PASSWORD: lgp
      POSTGRES_DB: postgres
    volumes:
      - ./postgresql_data:/var/lib/postgresql
  miaoma-lgp-redis:
    image: redis:8.4
    container_name: miaoma-lgp-redis
    ports:
      - 6379:6379
    environment:
      REDIS_PASSWORD: lgp
    # volumes:
    #   - ./redis-data:/data
